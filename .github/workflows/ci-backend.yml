name: Backend CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Run backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry -C backend install --no-root

      - name: Run Pytest
        run: poetry -C backend run pytest -v