name: Frontend CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend lint, tests and integrated E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with Biome
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run unit and integration tests
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Integrated E2E (FastAPI, PostgreSQL, React)
        working-directory: .
        run: make e2e

      - name: Show Docker logs on failure
        if: failure()
        working-directory: .
        run: docker compose --profile e2e logs --no-color

      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
          if-no-files-found: ignore

      - name: Stop test containers
        if: always()
        working-directory: .
        run: docker compose --profile e2e down -v --remove-orphans
